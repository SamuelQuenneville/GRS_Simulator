---
#--------------------------------------------------
#                  Run Simulation                 #
#--------------------------------------------------
# Description:
#
#
SimulationParameters:
  LOG_FILE_DIRECTORY: 'LogSim'
  AIRCRAFT_PROPERTIES_FILE_NAME: 'inputFilesExamples/sigCoeffs.yaml'
  TETHER_PROPERTIES_FILE_NAME: 'inputFilesExamples/tetherProperties.yaml'
  PAYLOAD_PROPERTIES_FILE_NAME: 'inputFilesExamples/payloadProperties.yaml'
  LAUNCHER_PROPERTIES_FILE_NAME: 'inputFilesExamples/launcherProperties.yaml'
  CONTROLLER_GAINS_FILE_NAME: 'inputFilesExamples/controllerGains.yaml'
#
SystemConfiguration:
  NUMBER_OF_UAV: 1
  CONFIGURATION: 'FREE' # FREE / V / Y
  GROUNDED: false
  HAVE_LAUNCHER: false
  HAVE_TARGET: false
  TETHER_AERO_ON: false
  HLC_RATE: 20  # Hertz
  LLC_RATE: 400 # Hertz
#
InitialStatesAircraft_1:
  POSITION   : [0.0, 0.0, -30.0] # [x y z]
  SPEED      : [26.0, 0.0, 0.0] # [vx vy vz]
  ORIENTATION: [0.1745, 0.0, 0.0] # [roll pitch yaw]
#
Target:
  POS_PAYLOAD: [0.0, 0.0, 0.0]
  GROUNDSPEED: 0.0 # m/s
  RADIUS: 0.0 # m
  AIRCRAFT_PITCH: 0.0
  AIRCRAFT_ROLL: 0.0
#
Wind:
  WIND: false
  TURBULENCE: false
  SEED: 1                        # For reproducibility of turbulence
  MEAN_WIND: [5.0, 0.0, 0.0]     # [m/s] [wx wy wz]
  MEAN_WIND_PROFILE: 'NONE'      # NONE, RAMP, POWERLAW
  MEAN_WIND_GROUND_HEIGHT: 15.0   # No wind below [m]
  MEAN_WIND_FULL_HEIGHT: 20.0    # Full wind above [m]
  SIGMA: [0.5, 0.5, 0.25]        # Turbulence intensity [m/s] [sig_wx sig_wy sig_wz]
  TURBULENCE_GROUND_HEIGHT: 5.0  # No turbulence below [m]
  TURBULENCE_FULL_HEIGHT: 15.0   # Full turbulence above [m]
  TURBULENCE_LENGTH_SCALE: 150.0 # integral length scale [m]
  TURBULENCE_LAMBDA_MIN: 0.5     # minimum wavelength [m]
  TURBULENCE_LAMBDA_MAX: 2000.0  # maximum wavelength [m]
  TURBULENCE_NUMBER_MODE: 1024   # total number of Fourier modes (must be even)
