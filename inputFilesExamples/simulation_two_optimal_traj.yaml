---
#--------------------------------------------------
#                  Run Simulation                 #
#--------------------------------------------------
# Description:
#
#
SimulationParameters:
  LOG_FILE_DIRECTORY: 'LogSim'
  AIRCRAFT_PROPERTIES_FILE_NAME: 'inputFilesExamples/sigCoeffs.yaml'
  TETHER_PROPERTIES_FILE_NAME: 'inputFilesExamples/tetherProperties.yaml'
  PAYLOAD_PROPERTIES_FILE_NAME: 'inputFilesExamples/payloadProperties.yaml'
  LAUNCHER_PROPERTIES_FILE_NAME: 'inputFilesExamples/launcherProperties.yaml'
  CONTROLLER_GAINS_FILE_NAME: 'inputFilesExamples/controllerGains.yaml'
  FIXED_DURATION: false
  DURATION: 100 # seconds
  WIND_ON: false
#
SystemConfiguration:
  NUMBER_OF_UAV: 2
  CONFIGURATION: 'V' # FREE / V / Y
  GROUNDED: false
  HAVE_LAUNCHER: false
  TETHER_AERO_ON: false
  HLC_RATE: 20  # Hertz
  LLC_RATE: 400 # Hertz
#
InitialStatesPayload:
  POSITION   : [0.0, 0.0, 0.0] # [x y z]
  SPEED      : [0.0, 0.0, 0.0] # [vx vy vz]
  ORIENTATION: [0.0, 0.0, 0.0] # [roll pitch yaw]
#
InitialStatesAircraft_1:
  POSITION   : [0.0, 30.0, -15] # [x y z]
  SPEED      : [20.0, 0.0, -2.0] # [vx vy vz]
  ORIENTATION: [0.0, 0.0, 0.0] # [roll pitch yaw]
#
InitialStatesAircraft_2:
  POSITION   : [0.0, -30.0, -15] # [x y z]
  SPEED      : [20.0, 0.0, -2.0] # [vx vy vz]
  ORIENTATION: [0.0, 0.0, 0.0] # [roll pitch yaw]
#
Target:
  POS_PAYLOAD: [0.0, 0.0, 0.0]
  GROUNDSPEED: 30.0 # m/s
  RADIUS: 26.0 # m
  AIRCRAFT_PITCH: 0.0
  AIRCRAFT_ROLL: 0.0
#
Wind: [0.0, 0.0, 0.0] # [wx wy wz]